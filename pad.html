<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#2a1f33" />
  <title>Hearthlight · Party controller</title>
  <meta name="description" content="You're invited to a Hearthlight party: play at the big screen with your phone as the controller, or from home on your own screen. Free, in the browser." />
  <!-- link previews for the party's invitation (docs/social, published at the site's root) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Hearthlight" />
  <meta property="og:title" content="Join the party! — Hearthlight" />
  <meta property="og:description" content="A friend invites you to play Hearthlight: at the big screen with your phone as the controller, or from home on your own screen. Free, in the browser." />
  <meta property="og:image" content="https://hearthlight.github.io/og-invite.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Hearthlight: you're invited to play — friends by a campfire under a lighthouse, in pixel art." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23f6c65b' d='M3 0h2v1h1v2h1v3H6v1H2V6H1V3h1V1h1z'/%3E%3Cpath fill='%23fff3c4' d='M3 2h2v3H3z'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1c1428;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    }
    #pad { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .field {
      position: fixed; display: none; box-sizing: border-box; margin: 0; padding: 0 10px;
      font: 700 16px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
      color: #3b2a2e; background: #fff8ea; border: 3px solid #8e5d3e; border-radius: 0; outline: none;
      touch-action: manipulation; user-select: text; -webkit-user-select: text;
    }
    .field:focus { border-color: #e0a526; }
    #code { text-transform: uppercase; text-align: center; letter-spacing: 6px; }
  </style>
</head>
<body>
  <canvas id="pad"></canvas>
  <input id="code" class="field" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="CODE" />
  <input id="name" class="field" maxlength="12" autocomplete="nickname" autocorrect="off" spellcheck="false" placeholder="Your name" />
  <script src="config.js"></script>
  <script type="module" src="./src/pad/pad.js"></script>
</body>
</html>
