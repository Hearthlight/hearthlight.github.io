# The desktop app for Mac (universal dmg), Windows (installer) and Linux (AppImage), built when a
# version tag is pushed (git tag v1.0.0 && git push origin v1.0.0) — or by hand from the Actions
# tab. The files land in a DRAFT release: nothing is public until someone presses « Publish ».
# (Unsigned builds: see the README for opening them on a Mac or on Windows.)
name: Desktop app
permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mac:
        description: Build the Mac app too (on a private repository macOS minutes count ten times)
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # (a tag builds all three; by hand, the Mac only when asked)
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.mac) && '[{"os":"macos-latest","script":"dist:mac"},{"os":"windows-latest","script":"dist:win"},{"os":"ubuntu-latest","script":"dist:linux"}]' || '[{"os":"windows-latest","script":"dist:win"},{"os":"ubuntu-latest","script":"dist:linux"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}
      - name: Test the packaged app and write checksums
        working-directory: desktop
        run: node scripts/smoke.mjs && node scripts/checksums.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearthlight-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/SHA256SUMS-*.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: Hearthlight ${{ github.ref_name }}
          files: out/*
